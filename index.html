<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Header Profile - Marcelo Oliveira Ribeiro</title>
    
    <style>
        /* Estilos globais para a página */
        body {
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            font-family: serif; /* Mantém a estética clássica e limpa */
            color: #000;
        }

        /* O contêiner do cabeçalho completo */
        .profile-header {
            display: flex; /* Alinha a foto e o texto lado a lado */
            align-items: flex-start; /* Alinha o conteúdo ao topo */
            gap: 25px; /* Espaço entre a foto e o bloco de texto */
            max-width: 800px; /* Largura máxima para legibilidade */
            margin: 0 auto; /* Centraliza o contêiner na página */
            padding-bottom: 15px;
            border-bottom: 2px solid #555; /* Linha horizontal de separação inferior */
        }

        /* Estilo da imagem do perfil */
        .profile-photo {
            width: 130px; /* Largura fixa para a foto */
            height: auto; /* Mantém a proporção */
            border: 1px solid #000; /* Borda preta fina e nítida */
            object-fit: cover; /* Garante que a imagem preencha o espaço sem distorcer */
            flex-shrink: 0; /* Impede que a foto encolha */
        }

        /* O bloco que contém o nome e as afiliações */
        .profile-info {
            display: flex;
            flex-direction: column; /* Organiza o nome e o texto verticalmente */
            justify-content: flex-start;
        }

        /* Título do nome */
        .profile-info h1 {
            margin: 0 0 10px 0; /* Remove margens padrão e adiciona espaço inferior */
            font-size: 2.2rem; /* Tamanho grande para o nome */
            font-weight: normal; /* Estilo mais limpo, não negrito excessivo */
            line-height: 1.1;
        }

        /* Bloco de texto de afiliação e cargo */
        .affiliation-text {
            margin: 0;
            font-size: 1.1rem; /* Tamanho de leitura confortável */
            line-height: 1.4; /* Espaçamento de linha para legibilidade */
        }

        /* Estilo dos links dentro da afiliação */
        .affiliation-text a {
            color: #0000ee; /* Azul de link padrão e limpo */
            text-decoration: underline; /* Sublinhado para clareza */
        }
    </style>
</head>
<body>

    <!-- O contêiner de perfil padronizado -->
    <header class="profile-header">
        
        <!-- Imagem do Perfil (Substitua "me.jpg" pelo seu arquivo) -->
        <img src="me.jpg" alt="Foto de Marcelo Oliveira Ribeiro" class="profile-photo">
        
        <!-- Bloco de Informações Pessoais -->
        <div class="profile-info">
            <h1>Marcelo Oliveira Ribeiro</h1>
            
            <p class="affiliation-text">
                Assistant Professor, <a href="https://portalpadrao.ufma.br/site" target="_blank" rel="noopener">Federal University of Maranhão</a>, Brazil
            </p>
        </div>

    </header>

</body>
</html>
